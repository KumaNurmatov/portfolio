async function open_(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
